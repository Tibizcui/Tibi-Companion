name: Build Windows installer

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist:win -- --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: TibiCompanion-Setup
          path: dist/*.exe
          retention-days: 7
